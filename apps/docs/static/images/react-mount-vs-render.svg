<svg viewBox="0 0 720 920" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <style>
    .terminal { fill: #e2e8f0; stroke: #475569; stroke-width: 1.5; }
    .once-shape { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .react-phase { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .browser-phase { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.5; }
    .effects-box { fill: #f8fafc; stroke: #475569; stroke-width: 1.5; }
    .killer-row { fill: #fef2f2; stroke: #dc2626; stroke-width: 1; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.5; }
    .arrow-loop { fill: none; stroke: #b45309; stroke-width: 1.75; stroke-dasharray: 5 3; }
    .node-text { font-size: 13px; fill: #1e293b; text-anchor: middle; }
    .node-title { font-size: 13px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
    .header-blue { font-size: 13px; font-weight: 700; fill: #2563eb; }
    .header-green { font-size: 13px; font-weight: 700; fill: #15803d; }
    .header-gray { font-size: 13px; font-weight: 700; fill: #1e293b; }
    .stage { font-size: 12px; fill: #1e293b; }
    .time-blue { font-size: 11px; fill: #2563eb; font-weight: 600; }
    .time-green { font-size: 11px; fill: #15803d; font-weight: 600; }
    .time-red { font-size: 11px; fill: #dc2626; font-weight: 700; }
    .label-once { font-size: 10px; font-weight: 700; fill: #b45309; text-anchor: middle; }
    .label-sm { font-size: 10px; fill: #475569; }
    .label-sm-italic { font-size: 10px; fill: #475569; font-style: italic; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
    .arrow-label-orange { font-size: 11px; font-weight: 700; fill: #b45309; }
    .arrow-label-gray { font-size: 11px; font-weight: 600; fill: #475569; }
  </style>

  <!-- Birth -->
  <rect class="terminal" x="250" y="20" width="220" height="36" rx="18"/>
  <text class="node-text" x="360" y="43">Component appears in tree</text>
  <path class="arrow" d="M 360 56 L 360 86" marker-end="url(#arrow)"/>

  <!-- MOUNT hex -->
  <text class="label-once" x="360" y="82">once</text>
  <polygon class="once-shape" points="270,95 450,95 478,125 450,155 270,155 242,125"/>
  <text class="node-title" x="360" y="121">MOUNT</text>
  <text class="label-sm" x="360" y="138" text-anchor="middle">allocate hook slots · run useState / useRef initializers</text>
  <path class="arrow" d="M 360 155 L 360 188" marker-end="url(#arrow)"/>

  <!-- React phase box -->
  <rect class="react-phase" x="180" y="192" width="360" height="115" rx="6"/>
  <text class="header-blue" x="195" y="212">React phase  —  your JS, no DOM paint</text>
  <line x1="190" y1="220" x2="530" y2="220" stroke="#bfdbfe" stroke-width="1"/>

  <text class="stage" x="195" y="242">render — call fn, build tree</text>
  <text class="time-blue" x="525" y="242" text-anchor="end">0.1–5 ms</text>

  <text class="stage" x="195" y="267">reconcile — diff vs prev tree</text>
  <text class="time-blue" x="525" y="267" text-anchor="end">0.1–5 ms</text>

  <text class="stage" x="195" y="292">commit — mutate DOM nodes</text>
  <text class="time-blue" x="525" y="292" text-anchor="end">µs / node</text>

  <path class="arrow" d="M 360 307 L 360 340" marker-end="url(#arrow)"/>

  <!-- Browser phase box -->
  <rect class="browser-phase" x="180" y="344" width="360" height="155" rx="6"/>
  <text class="header-green" x="195" y="364">Browser phase  —  no React, same as vanilla DOM</text>
  <line x1="190" y1="372" x2="530" y2="372" stroke="#bbf7d0" stroke-width="1"/>

  <text class="stage" x="195" y="394">style — recalc CSS</text>
  <text class="time-green" x="525" y="394" text-anchor="end">1–10 ms</text>

  <rect class="killer-row" x="190" y="405" width="340" height="22" rx="3"/>
  <text class="stage" x="195" y="420">layout — geometry ⚠</text>
  <text class="time-red" x="525" y="420" text-anchor="end">5–50 ms ← killer</text>

  <text class="stage" x="195" y="445">paint — rasterize</text>
  <text class="time-green" x="525" y="445" text-anchor="end">1–10 ms</text>

  <text class="stage" x="195" y="470">composite — GPU layers</text>
  <text class="time-green" x="525" y="470" text-anchor="end">&lt; 1 ms</text>

  <line x1="190" y1="480" x2="530" y2="480" stroke="#bbf7d0" stroke-width="1"/>
  <text class="label-sm" x="195" y="494" font-weight="700">Budget @ 60 Hz: 16.6 ms / frame</text>

  <path class="arrow" d="M 360 499 L 360 532" marker-end="url(#arrow)"/>

  <!-- Effects fire -->
  <rect class="effects-box" x="180" y="536" width="360" height="60" rx="6"/>
  <text class="header-gray" x="195" y="556">Effects fire  —  after commit, in source order</text>
  <text class="label-sm" x="195" y="578"><tspan class="mono">[]</tspan> mount only · <tspan class="mono">[dep]</tspan> if dep changed · <tspan class="mono">no array</tspan> every render</text>
  <text class="label-sm" x="195" y="592">Cleanup runs before re-run (captures previous values).</text>

  <path class="arrow" d="M 360 596 L 360 628" marker-end="url(#arrow)"/>

  <!-- Decision diamond -->
  <polygon class="effects-box" points="360,632 500,690 360,748 220,690"/>
  <text class="node-text" x="360" y="685">What's the next</text>
  <text class="node-text" x="360" y="703">trigger?</text>

  <!-- Loop back: from left of diamond, curving up and right to React phase -->
  <path class="arrow-loop" d="M 220 690 Q 90 690 90 250 Q 90 220 178 220" marker-end="url(#arrow-orange)"/>
  <text class="arrow-label-orange" x="40" y="465">re-render</text>
  <text class="label-sm" x="20" y="482">state / prop /</text>
  <text class="label-sm" x="20" y="496">parent / context</text>
  <text class="label-sm" x="20" y="510">change</text>

  <!-- Branch to UNMOUNT (down from diamond) -->
  <path class="arrow" d="M 360 748 L 360 782" marker-end="url(#arrow)"/>
  <text class="arrow-label-gray" x="500" y="762" text-anchor="start">key / type change</text>
  <text class="arrow-label-gray" x="500" y="775" text-anchor="start">or removed</text>

  <!-- UNMOUNT hex -->
  <text class="label-once" x="360" y="780">once</text>
  <polygon class="once-shape" points="270,790 450,790 478,820 450,850 270,850 242,820"/>
  <text class="node-title" x="360" y="816">UNMOUNT</text>
  <text class="label-sm" x="360" y="833" text-anchor="middle">cleanup effects · remove DOM · free hook slots</text>

  <path class="arrow" d="M 360 850 L 360 880" marker-end="url(#arrow)"/>

  <!-- Gone pill -->
  <rect class="terminal" x="250" y="884" width="220" height="36" rx="18"/>
  <text class="node-text" x="360" y="907">Instance gone — state lost</text>
</svg>
