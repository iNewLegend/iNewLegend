<svg viewBox="0 0 720 980" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .node-text { font-size: 14px; fill: #1e293b; text-anchor: middle; }
    .node-title { font-size: 14px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
    .label { font-size: 11px; fill: #475569; text-anchor: middle; }
    .arrow-label { font-size: 12px; font-weight: 600; fill: #b45309; text-anchor: middle; }
    .box { fill: #f1f5f9; stroke: #475569; stroke-width: 1.5; }
    .once { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .terminal { fill: #e2e8f0; stroke: #475569; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.5; }
    .arrow-loop { fill: none; stroke: #b45309; stroke-width: 1.75; stroke-dasharray: 5 4; }
  </style>

  <rect class="terminal" x="260" y="20" width="200" height="44" rx="22"/>
  <text class="node-text" x="360" y="48">Component appears in tree</text>

  <path class="arrow" d="M 360 64 L 360 99" marker-end="url(#arrow)"/>

  <polygon class="once" points="290,108 430,108 462,148 430,188 290,188 258,148"/>
  <text class="node-title" x="360" y="138">MOUNT — once</text>
  <text class="label" x="360" y="158">allocate hook slots</text>
  <text class="label" x="360" y="174">run useState / useRef inits</text>

  <path class="arrow" d="M 360 188 L 360 222" marker-end="url(#arrow)"/>

  <rect class="box" x="260" y="230" width="200" height="60" rx="6"/>
  <text class="node-title" x="360" y="255">RENDER</text>
  <text class="label" x="360" y="275">call component fn → tree</text>

  <path class="arrow" d="M 360 290 L 360 322" marker-end="url(#arrow)"/>

  <rect class="box" x="260" y="330" width="200" height="44" rx="6"/>
  <text class="node-text" x="360" y="357">Reconcile vs previous tree</text>

  <path class="arrow" d="M 360 374 L 360 406" marker-end="url(#arrow)"/>

  <rect class="box" x="260" y="414" width="200" height="44" rx="6"/>
  <text class="node-text" x="360" y="441">Commit to DOM</text>

  <path class="arrow" d="M 360 458 L 360 490" marker-end="url(#arrow)"/>

  <rect class="box" x="260" y="498" width="200" height="60" rx="6"/>
  <text class="node-title" x="360" y="523">Effects</text>
  <text class="label" x="360" y="543">cleanup + setup</text>

  <path class="arrow" d="M 360 558 L 360 588" marker-end="url(#arrow)"/>

  <polygon class="box" points="360,594 488,672 360,750 232,672"/>
  <text class="node-text" x="360" y="660">state / props / parent /</text>
  <text class="node-text" x="360" y="680">context changed?</text>

  <path class="arrow" d="M 360 750 L 360 794" marker-end="url(#arrow)"/>
  <text class="label" x="385" y="775" text-anchor="start">removed from tree</text>

  <polygon class="once" points="290,802 430,802 462,842 430,882 290,882 258,842"/>
  <text class="node-title" x="360" y="832">UNMOUNT — once</text>
  <text class="label" x="360" y="852">cleanup effects</text>
  <text class="label" x="360" y="868">remove DOM nodes</text>

  <path class="arrow" d="M 360 882 L 360 916" marker-end="url(#arrow)"/>

  <rect class="terminal" x="260" y="924" width="200" height="44" rx="22"/>
  <text class="node-text" x="360" y="952">Instance gone — state lost</text>

  <path class="arrow-loop" d="M 488 672 C 600 672 620 672 620 260 C 620 230 540 230 460 260" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="624" y="460">re-render</text>
  <text class="label" x="624" y="478">(state / props /</text>
  <text class="label" x="624" y="492">parent change)</text>
</svg>
